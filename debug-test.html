<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extension Debug Test</title>
    <!-- MUI via CDN for testing -->
    <script src="https://unpkg.com/@mui/material@5.15.0/umd/material-ui.development.js"></script>
    <script src="https://unpkg.com/@emotion/react@11.11.1/dist/emotion-react.umd.min.js"></script>
    <script src="https://unpkg.com/@emotion/styled@11.11.0/dist/emotion-styled.umd.min.js"></script>
    <!-- Roku RDS would be here in a real app -->
    <script>
        // Simulate Roku RDS packages
        window.RokuRDS = { version: '11.0.7' };
    </script>
</head>
<body>
    <div id="root">
        <h1>Extension Debug Test Page</h1>
        
        <!-- Simulate MUI components with classes -->
        <div class="MuiButton-root MuiButton-contained">Button Component</div>
        <div class="MuiTextField-root">Text Field Component</div>
        <div class="MuiCard-root">
            <div class="MuiCardContent-root">Card Component</div>
        </div>
        <div class="MuiTypography-root MuiTypography-h1">Typography Component</div>
        <div class="MuiPaper-root MuiPaper-elevation1">Paper Component</div>
        
        <!-- Custom components -->
        <div class="CustomButton">Custom Button</div>
        <div class="CustomCard">Custom Card</div>
        <div class="MyComponent">My Component</div>
        
        <!-- Bootstrap components -->
        <div class="btn btn-primary">Bootstrap Button</div>
        <div class="card">Bootstrap Card</div>
    </div>

    <script>
        console.log('Test page loaded');
        console.log('Available MUI:', typeof window.MaterialUI);
        console.log('Available Roku RDS:', typeof window.RokuRDS);
        
        // Wait for extension to load
        setTimeout(() => {
            console.log('Page ready for analysis');
        }, 1000);
    </script>
</body>
</html>
