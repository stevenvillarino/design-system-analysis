<!DOCTYPE html>
<html>
<head>
  <title>Design System Analyzer</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <span class="logo-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M9.5 3A6.5 6.5 0 0 1 16 9.5c0 1.61-.59 3.09-1.56 4.23l.27.27h.79l5 5-1.5 1.5-5-5v-.79l-.27-.27A6.516 6.516 0 0 1 9.5 16 6.5 6.5 0 0 1 3 9.5 6.5 6.5 0 0 1 9.5 3m0 2C7 5 5 7 5 9.5S7 14 9.5 14 14 12 14 9.5 12 5 9.5 5Z" fill="currentColor"/>
            </svg>
          </span>
          <span class="logo-text">DS Analyzer</span>
        </div>
        <button class="refresh-btn" id="refreshBtn" title="Refresh Analysis">
          <span class="refresh-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>
      </div>
    </header>

    <!-- Loading State -->
    <div class="loading-container" id="loadingContainer">
      <div class="loading-spinner"></div>
      <p class="loading-text">Analyzing components...</p>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="mainContent" style="display: block;">
      <div id="analysis-results">
        <div class="stats-grid">
          <div class="stat-card mui">
            <div class="stat-icon">🔵</div>
            <div class="stat-content">
              <div class="stat-number" id="muiCount">-</div>
              <div class="stat-label">MUI Components</div>
            </div>
          </div>
          <div class="stat-card custom">
            <div class="stat-icon">🟠</div>
            <div class="stat-content">
              <div class="stat-number" id="customCount">-</div>
              <div class="stat-label">Custom</div>
            </div>
          </div>
          <div class="stat-card packages">
            <div class="stat-icon">📦</div>
            <div class="stat-content">
              <div class="stat-number" id="packageCount">-</div>
              <div class="stat-label">Packages</div>
            </div>
          </div>
        </div>

        <div class="coverage-section">
          <h3 class="section-title">Coverage Analysis <span class="tooltip-icon" title="This shows the ratio of MUI components to custom-built components on the page.">?</span></h3>
          <div class="coverage-bar">
            <div class="coverage-mui" id="coverageBarMui" style="width: 0%;"></div>
            <div class="coverage-custom" id="coverageBarCustom" style="width: 0%;"></div>
          </div>
          <div class="coverage-legend">
            <div class="legend-item mui"><span id="muiPercentage">0%</span> MUI</div>
            <div class="legend-item custom"><span id="customPercentage">0%</span> Custom</div>
          </div>
        </div>

        <div class="insights-section">
          <h3 class="section-title">Insights</h3>
          <div class="insight-cards" id="insightCards">
            <div class="insight-card">Click "Analyze Page" to see insights.</div>
          </div>
        </div>

        <div class="tabs-section">
          <div class="tab-list">
            <button class="tab-button active" data-tab="components">Components</button>
            <button class="tab-button" data-tab="packages">Packages</button>
            <button class="tab-button" data-tab="debug">Debug</button>
          </div>
          <div class="tab-content active" id="components-tab">
            <div class="component-grid" id="componentGrid">
              <!-- Component cards will be injected here -->
            </div>
          </div>
          <div class="tab-content" id="packages-tab">
            <div class="package-grid" id="packageGrid">
              <!-- Package cards will be injected here -->
            </div>
          </div>
          <div class="tab-content" id="debug-tab">
            <div class="debug-output" id="debugOutput">
              <div class="debug-entry">Debug logs will appear here when enabled.</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
