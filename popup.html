<!DOCTYPE html>
<html>
<head>
  <title>Design System Analyzer</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <span class="logo-icon">🔍</span>
          <span class="logo-text">DS Analyzer</span>
        </div>
        <button class="refresh-btn" id="refreshBtn" title="Refresh Analysis">
          <span class="refresh-icon">↻</span>
        </button>
      </div>
    </header>

    <!-- Loading State -->
    <div class="loading-container" id="loadingContainer">
      <div class="loading-spinner"></div>
      <p class="loading-text">Analyzing components...</p>
    </div>

    <!-- Main Content -->
    <main class="main-content" id="mainContent" style="display: none;">
      
      <!-- Quick Stats -->
      <section class="stats-grid">
        <div class="stat-card mui">
          <div class="stat-icon">🔵</div>
          <div class="stat-content">
            <div class="stat-number" id="muiCount">0</div>
            <div class="stat-label">MUI Components</div>
          </div>
        </div>
        
        <div class="stat-card custom">
          <div class="stat-icon">🔴</div>
          <div class="stat-content">
            <div class="stat-number" id="customCount">0</div>
            <div class="stat-label">Custom Components</div>
          </div>
        </div>
        
        <div class="stat-card packages">
          <div class="stat-icon">📦</div>
          <div class="stat-content">
            <div class="stat-number" id="packageCount">0</div>
            <div class="stat-label">Packages</div>
          </div>
        </div>
      </section>

      <!-- Controls -->
      <section class="controls-section">
        <div class="control-group">
          <label class="control-label">Overlays</label>
          <div class="toggle-grid">
            <label class="toggle-item">
              <input type="checkbox" id="muiOverlayToggle" checked>
              <span class="toggle-slider"></span>
              <span class="toggle-text">MUI</span>
            </label>
            
            <label class="toggle-item">
              <input type="checkbox" id="customOverlayToggle" checked>
              <span class="toggle-slider"></span>
              <span class="toggle-text">Custom</span>
            </label>
            
            <label class="toggle-item">
              <input type="checkbox" id="packageOverlayToggle" checked>
              <span class="toggle-slider"></span>
              <span class="toggle-text">Packages</span>
            </label>
          </div>
        </div>
        
        <div class="control-group">
          <label class="toggle-item highlight">
            <input type="checkbox" id="slideColorToggle">
            <span class="toggle-slider"></span>
            <span class="toggle-text">Highlight Effects</span>
          </label>
        </div>
      </section>

      <!-- Tabs -->
      <section class="tabs-section">
        <div class="tab-list" role="tablist">
          <button class="tab-button active" data-tab="overview" role="tab">Overview</button>
          <button class="tab-button" data-tab="components" role="tab">Components</button>
          <button class="tab-button" data-tab="packages" role="tab">Packages</button>
        </div>

        <!-- Overview Tab -->
        <div class="tab-content active" id="overview-tab">
          <div class="coverage-section">
            <h3 class="section-title">Coverage Analysis</h3>
            <div class="coverage-bar">
              <div class="coverage-mui" id="coverageBarMui" style="width: 0%"></div>
              <div class="coverage-custom" id="coverageBarCustom" style="width: 0%"></div>
            </div>
            <div class="coverage-legend">
              <span class="legend-item mui">MUI: <span id="muiPercentage">0%</span></span>
              <span class="legend-item custom">Custom: <span id="customPercentage">0%</span></span>
            </div>
          </div>
          
          <div class="insights-section" id="insightsSection">
            <h3 class="section-title">Insights</h3>
            <div class="insight-cards" id="insightCards">
              <!-- Dynamic insights will be added here -->
            </div>
          </div>
        </div>

        <!-- Components Tab -->
        <div class="tab-content" id="components-tab">
          <div class="component-grid" id="componentGrid">
            <!-- Dynamic component cards will be added here -->
          </div>
        </div>

        <!-- Packages Tab -->
        <div class="tab-content" id="packages-tab">
          <div class="package-grid" id="packageGrid">
            <!-- Dynamic package cards will be added here -->
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
