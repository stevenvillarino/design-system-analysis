<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page for Design System Analyzer</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- MUI CSS -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <!-- Custom styles -->
    <style>
        .CustomCard {
            border: 2px solid #333;
            border-radius: 8px;
            padding: 16px;
            margin: 16px;
            background: #f8f9fa;
        }
        
        .CustomButton {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .CustomNavigation {
            background: #343a40;
            padding: 12px;
            color: white;
        }
        
        .TestComponent {
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Test App</a>
            <div class="CustomNavigation">
                <span>Custom Navigation</span>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <h1 class="MuiTypography-root MuiTypography-h1">MUI Typography Title</h1>
                
                <div class="CustomCard">
                    <h3>Custom Card Component</h3>
                    <p>This is a custom card component for testing.</p>
                    <button class="CustomButton">Custom Button</button>
                </div>
                
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Bootstrap Card</h5>
                        <p class="card-text">This is a Bootstrap card component.</p>
                        <a href="#" class="btn btn-primary">Bootstrap Button</a>
                    </div>
                </div>
                
                <div class="MuiPaper-root MuiPaper-elevation1" style="padding: 16px; margin: 16px 0;">
                    <button class="MuiButton-root MuiButton-contained MuiButton-containedPrimary">
                        MUI Button
                    </button>
                    <div class="MuiTextField-root" style="margin: 8px;">
                        <input type="text" placeholder="MUI TextField" class="MuiInputBase-input" />
                    </div>
                </div>
                
                <div class="TestComponent">
                    <span class="MuiIcon-root">home</span>
                    <span>Test Component with Icon</span>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="alert alert-info" role="alert">
                    Bootstrap Alert
                </div>
                
                <div class="MuiAlert-root MuiAlert-standardInfo" style="margin: 16px 0;">
                    <div class="MuiAlert-message">MUI Alert Component</div>
                </div>
                
                <div class="CustomCard">
                    <h4>Sidebar Content</h4>
                    <p>Custom sidebar component.</p>
                    <button class="CustomButton">Another Custom Button</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- React (for testing detection) -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
    
    <script>
        // Add some global objects for testing
        window.MUI = { version: '5.14.0' };
        window.bootstrap = { Tooltip: { VERSION: '5.3.0' } };
        
        console.log('Test page loaded with MUI, Bootstrap, and React components');
    </script>
</body>
</html>
